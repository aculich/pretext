<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext ecosystem catalog</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2ec;
      --panel: #fffdf8;
      --ink: #1c1816;
      --muted: #5c534c;
      --rule: #d5cbc0;
      --accent: #8b4d2f;
      --core: #0f5132;
      --adj: #664d03;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .wrap {
      width: min(1100px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }
    h1 {
      margin: 0;
      font: 700 28px/1.15 Georgia, "Times New Roman", serif;
    }
    .sub {
      margin: 8px 0 0;
      max-width: 72ch;
      line-height: 1.55;
      color: var(--muted);
    }
    .stats {
      margin: 14px 0 0;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted);
    }
    .controls {
      margin-top: 22px;
      display: grid;
      gap: 12px;
    }
    input[type="search"] {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--rule);
      background: #fff;
      font: inherit;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button.chip {
      border: 1px solid var(--rule);
      background: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      font: 12px ui-monospace, monospace;
      cursor: pointer;
    }
    button.chip[aria-pressed="true"] {
      background: var(--ink);
      color: #fffdf8;
      border-color: var(--ink);
    }
    #grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }
    .card {
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 14px 16px;
      background: var(--panel);
      /* Intentionally no backdrop-filter (see research/forks/ECOSYSTEM-CATALOG-PERF.md). */
      box-shadow: 0 10px 26px rgb(40 30 20 / 0.06);
    }
    .card h3 {
      margin: 0;
      font-size: 15px;
      word-break: break-word;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      justify-content: space-between;
    }
    .meta {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .card > p {
      margin: 10px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--ink);
    }
    .links {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    a.pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--rule);
      text-decoration: none;
      color: var(--accent);
      font-size: 12px;
      background: #fff;
    }
    a.pill:hover { border-color: var(--accent); }
    .rationale {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
    }
    .badge {
      font: 10px ui-monospace, monospace;
      padding: 3px 7px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .badge.core {
      background: #d1e7dd;
      color: var(--core);
    }
    .badge.adjacent {
      background: #fff3cd;
      color: var(--adj);
    }
    .badge.unclear {
      background: #e2e3e5;
      color: #41464b;
    }
    .empty {
      grid-column: 1 / -1;
      padding: 18px;
      border: 1px dashed var(--rule);
      border-radius: 14px;
      color: var(--muted);
    }
    #more {
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--rule);
      background: #fff;
      cursor: pointer;
      font: inherit;
    }
    #more:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <main class="wrap">
    <p style="margin:0 0 6px;font:12px ui-monospace,monospace;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);">Pretext fork</p>
    <h1>Ecosystem catalog</h1>
    <p class="sub">
      Local mirror of <a href="https://github.com/ShipItAndPray/awesome-pretext">awesome-pretext</a>
      plus discovery hits, regenerated from <code>bun run ecosystem:intake</code>.
      Shallow clones live under <code>upstream/</code> (gitignored). This page uses debounced search,
      category filters, and incremental rendering to stay responsive.
    </p>
    <p class="stats" id="stats"></p>
    <div class="controls">
      <input id="search" type="search" placeholder="Filter by name, description, tags…" autocomplete="off" />
      <div class="chips" id="chips" role="toolbar" aria-label="Category"></div>
    </div>
    <div id="grid"></div>
    <button type="button" id="more" hidden>Load more</button>
  </main>
  <script type="module" src="./ecosystem-catalog.ts"></script>
</body>
</html>
